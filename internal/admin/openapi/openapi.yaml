      summary: Update app
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/app-props.schema.json'
      responses:
        '200':
          description: An app
          content:
            application/json:
              schema:
                $ref: './schemas/app.schema.json'
        default:
          $ref: '#/components/responses/ErrorResponse'
    delete:
      operationId: deleteApp
      tags:
        - Apps
      summary: Delete app
      responses:
        '204':
          description: App deleted successfully
        default:
          $ref: '#/components/responses/ErrorResponse'
