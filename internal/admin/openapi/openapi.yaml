      description: An error occurred.
      content:
        application/json:
          schema:
            $ref: './schemas/error.schema.json'
  parameters:
    idParam:
      name: id
      in: path
      required: true
      description: 'An id of a resource'
      schema:
        $ref: './schemas/id.schema.json'
