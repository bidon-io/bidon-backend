# yaml-language-server: $schema=../../../../configuration-schema.json
package: api
generate:
  echo-server: true
  models: true
  embedded-spec: true
output: api.gen.go
output-options:
  skip-prune: true
  # POST /v2/telemetry stays in openapi.yaml as the contract. bidon-telemetry serves it.
  exclude-operation-ids:
    - postTelemetry
