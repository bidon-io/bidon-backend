openapi: 3.0.3
info:
  title: SDK API
  version: 1.0.0
paths:
  /v2/auction/{ad_type}:
    post:
      summary: Auction
      operationId: getAuction
      parameters:
        - $ref: '#/components/parameters/X-Bidon-Version'
        - $ref: '#/components/parameters/AdType'
      requestBody:
        description: Auction request
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/auction-request.schema.json'
      responses:
        '200':
          description: Auction response
          content:
            application/json:
              schema:
                $ref: './schemas/auction-response.schema.json'
      default:
        description: Error
        content:
          application/problem+json:
            schema:
              $ref: './schemas/error.schema.json'
  /v2/click/{ad_type}:
    post:
      summary: Click
      operationId: postClick
      parameters:
        - $ref: '#/components/parameters/X-Bidon-Version'
        - $ref: '#/components/parameters/AdType'
      requestBody:
        description: Click request
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/click-request.schema.json'
      responses:
        '200':
          description: Click response
          content:
            application/json:
              schema:
                $ref: './schemas/success-response.schema.json'
      default:
        description: Error
        content:
          application/problem+json:
            schema:
              $ref: './schemas/error.schema.json'
  /v2/config:
    post:
      summary: Get config
      operationId: getConfig
      parameters:
        - $ref: '#/components/parameters/X-Bidon-Version'
      requestBody:
        description: Config request
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/config-request.schema.json'
      responses:
        '200':
          description: Config response
          content:
            application/json:
              schema:
                $ref: './schemas/config-response.schema.json'
      default:
        description: Error
        content:
          application/problem+json:
            schema:
              $ref: './schemas/error.schema.json'
  /v2/loss/{ad_type}:
    post:
      summary: Loss
      operationId: postLoss
      parameters:
        - $ref: '#/components/parameters/X-Bidon-Version'
        - $ref: '#/components/parameters/AdType'
      requestBody:
        description: Loss request
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/loss-request.schema.json'
      responses:
        '200':
          description: Loss response
          content:
            application/json:
              schema:
                $ref: './schemas/success-response.schema.json'
      default:
        description: Error
        content:
          application/problem+json:
            schema:
              $ref: './schemas/error.schema.json'
  /v2/stats/{ad_type}:
    post:
      summary: Stats
      operationId: postStats
      parameters:
        - $ref: '#/components/parameters/X-Bidon-Version'
        - $ref: '#/components/parameters/AdType'
      requestBody:
        description: Stats request
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/stats-request.schema.json'
      responses:
        '200':
          description: Stats response
          content:
            application/json:
              schema:
                $ref: './schemas/success-response.schema.json'
      default:
        description: Error
        content:
        application/problem+json:
          schema:
            $ref: './schemas/error.schema.json'
  /v2/show/{ad_type}:
    post:
      summary: Show
      operationId: postShow
      parameters:
        - $ref: '#/components/parameters/X-Bidon-Version'
        - $ref: '#/components/parameters/AdType'
      requestBody:
        description: Show request
        required: true
        content:
          application/json:
            schema:
