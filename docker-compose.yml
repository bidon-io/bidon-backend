services:
  migrate:
    image: golang:1.24-alpine
    volumes:
      - .:/app
      - gomodcache:/go/pkg/mod
      - gocache:/root/.cache/go-build
    working_dir: /app
    command: go run ./cmd/bidon-migrate -no-gen up
    depends_on:
      - postgres
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgres://bidon:pass@postgres:5432/bidon
      DATABASE_REPLICA_URL: postgres://bidon:pass@postgres:5432/bidon

  migrate-test:
    image: golang:1.24-alpine
    volumes:
      - .:/app
      - gomodcache:/go/pkg/mod
      - gocache:/root/.cache/go-build
    working_dir: /app
    command: go run ./cmd/bidon-migrate up
    depends_on:
      - postgres-test
    environment:
      ENVIRONMENT: test
      DATABASE_URL: postgres://bidon:pass@postgres-test:5432/bidon_test
      DATABASE_REPLICA_URL: postgres://bidon:pass@postgres-test:5432/bidon_test

  go-test:
    profiles: ['test']
    image: golang:1.24-alpine
    volumes:
      - .:/app
      - gomodcache:/go/pkg/mod
      - gocache:/root/.cache/go-build
    working_dir: /app
    entrypoint: ["go", "test"]
    command: ./...
    depends_on:
      migrate-test:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgres://bidon:pass@postgres-test:5432/bidon_test
      DATABASE_REPLICA_URL: postgres://bidon:pass@postgres-test:5432/bidon_test

  go-pre-commit:
    build:
      context: .
      target: pre-commit-deps
    volumes:
      - .:/app
      - gomodcache-precommit:/go/pkg/mod
      - gocache-precommit:/root/.cache/go-build
    working_dir: /app
    entrypoint: ["pre-commit", "run", "--all-files"]
    networks:
      - precommit-network

  postgres:
    image: postgres:17-alpine
    ports:
      - '5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: bidon
      POSTGRES_USER: bidon
      POSTGRES_PASSWORD: pass
    healthcheck:
      test: pg_isready -U bidon -d bidon
      interval: 5s

  postgres-test:
    image: postgres:17-alpine
    ports:
      - '5435:5432'
    volumes:
      - pgdata-test:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: bidon_test
      POSTGRES_USER: bidon
      POSTGRES_PASSWORD: pass
    healthcheck:
      test: pg_isready -U bidon -d bidon_test
      interval: 5s

  redis:
    build:
        context: .
        dockerfile: docker/redis/Dockerfile
    ports:
      - '7001-7003:7001-7003'
    environment:
      - REDIS_CLUSTER_START_PORT=7001
    volumes:
      - redis-data:/data

  zookeeper:
    image: confluentinc/cp-zookeeper:7.2.1
    hostname: zookeeper
    healthcheck:
      test: echo srvr | nc zookeeper 2181 || exit 1
      retries: 20
      interval: 10s
    ports:
      - '2181:2181'
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # Use localhost:9092 to connect from local machine
  # Use kafka:29092 to connect from compose network, e.g. from debezium container
  # Use host.docker.internal:9093 to connect external docker network, for example ClickHouse in separate docker-compose file
  kafka:
    image: confluentinc/cp-kafka:7.2.1
    hostname: kafka
    depends_on:
      - zookeeper
    ports:
      - '9092:9092'
      - '9093:9093'
      - '9101:9101'
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper:2181'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT,EXTERNAL_DOCKER:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_INTERNAL://:29092,EXTERNAL_DOCKER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092,EXTERNAL_DOCKER://host.docker.internal:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CONFLUENT_SCHEMA_REGISTRY_URL: http://schema-registry:8081

  kafka-connect:
    build:
      context: .
      dockerfile: docker/kafka-connect/Dockerfile
    hostname: connect
    ports:
      - "8083:8083"
    depends_on:
      - kafka
      - zookeeper
    environment:
      CONNECT_BOOTSTRAP_SERVERS: 'kafka:29092'
      CONNECT_REST_ADVERTISED_HOST_NAME: connect
      CONNECT_REST_PORT: 8083
      CONNECT_GROUP_ID: "connect-cluster"
      CONNECT_CONFIG_STORAGE_TOPIC: kafka-connect-configs
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_TOPIC: kafka-connect-offsets
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_TOPIC: kafka-connect-status
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_KEY_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_VALUE_CONVERTER: org.apache.kafka.connect.storage.StringConverter
      CONNECT_INTERNAL_KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_INTERNAL_VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_PLUGIN_PATH: /usr/share/java,/usr/share/confluent-hub-components
    healthcheck:
      test: curl --fail http://localhost:8083 || exit 1
      interval: 5s
      retries: 10
      start_period: 15s

  kafka-connect-setup:
    image: curlimages/curl:latest
    user: root
    depends_on:
      kafka-connect:
        condition: service_healthy
    volumes:
      - ./docker/kafka-connect:/tmp
    env_file:
      - .env
    entrypoint: >
      sh -c "apk add --no-cache gettext &&
             sh /tmp/create-connector.sh"
    network_mode: "service:kafka-connect"

  schema-registry:
    image: confluentinc/cp-schema-registry:7.2.1
    hostname: schema-registry
    depends_on:
      - kafka
    ports:
      - '8081:8081'
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: 'kafka:29092'
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081

  rust-test:
    profiles: ['test']
    build:
      context: .
      target: proxy-builder
    volumes:
      - .:/proxy/src
      - cargo-cache:/usr/local/cargo/registry
      - target-cache:/proxy/src/target
    working_dir: /proxy/src
    command: cargo test --all-features

volumes:
  pgdata:
  pgdata-test:
  gomodcache:
  gocache:
  gomodcache-precommit:
  gocache-precommit:
  redisdata:
  cargo-cache:
  target-cache:
  redis-data:

networks:
  precommit-network:
