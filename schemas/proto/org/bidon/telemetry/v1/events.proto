syntax = "proto3";

package org.bidon.telemetry.v1;

import "google/protobuf/descriptor.proto";

extend google.protobuf.MessageOptions {
  // Catalog event_name for a telemetry-events message. Every message that
  // embeds Envelope must declare it; the emitter reads it from the type.
  string event_name = 50000;
  // The event is about one DSP. The emitter drops it unless
  // envelope.demand.dsp_id is set.
  bool requires_dsp = 50001;
}

// Host is who embeds the SDK.
enum Host {
  HOST_UNSPECIFIED = 0;
  HOST_PUBLISHER = 1;
  HOST_MAX_ADAPTER = 2;
}

// AuctionOwner is who runs the auction.
enum AuctionOwner {
  AUCTION_OWNER_UNSPECIFIED = 0;
  AUCTION_OWNER_BIDON = 1;
  AUCTION_OWNER_MAX = 2;
}

// IntegrationMode is the derived label: direct, max_custom or max_bidding.
enum IntegrationMode {
  INTEGRATION_MODE_UNSPECIFIED = 0;
  INTEGRATION_MODE_DIRECT = 1;
  INTEGRATION_MODE_MAX_CUSTOM = 2;
  INTEGRATION_MODE_MAX_BIDDING = 3;
}

// Mediator is the mediation host. Extensible.
enum Mediator {
  MEDIATOR_UNSPECIFIED = 0;
  MEDIATOR_BIDON = 1;
  MEDIATOR_MAX = 2;
  MEDIATOR_LEVEL_PLAY = 3;
  MEDIATOR_ADMOB = 4;
}

// DemandType is bidding or a direct deal. There is no network demand.
enum DemandType {
  DEMAND_TYPE_UNSPECIFIED = 0;
  DEMAND_TYPE_BIDDING = 1;
  DEMAND_TYPE_DIRECT_DEAL = 2;
}

// ConnectionType is the telemetry set plus the coarser values the auction
// request already sends (ethernet, 2G, 3G, generic cellular). Those are not
// collapsed into unknown.
enum ConnectionType {
  CONNECTION_TYPE_UNSPECIFIED = 0;
  CONNECTION_TYPE_WIFI = 1;
  CONNECTION_TYPE_CELLULAR_4G = 2;
  CONNECTION_TYPE_CELLULAR_5G = 3;
  CONNECTION_TYPE_OFFLINE = 4;
  CONNECTION_TYPE_UNKNOWN = 5;
  CONNECTION_TYPE_ETHERNET = 6;
  CONNECTION_TYPE_CELLULAR = 7;
  CONNECTION_TYPE_CELLULAR_2G = 8;
  CONNECTION_TYPE_CELLULAR_3G = 9;
}

// ConsentSource is who supplied the consent signals: bidon_cmp, max_sdk or
// publisher_api. Left unspecified when the request does not say.
enum ConsentSource {
  CONSENT_SOURCE_UNSPECIFIED = 0;
  CONSENT_SOURCE_BIDON_CMP = 1;
  CONSENT_SOURCE_MAX_SDK = 2;
  CONSENT_SOURCE_PUBLISHER_API = 3;
}

// AdvertisingIdState is why advertising_id is a real id or an all-zero UUID.
// Order: COPPA, then no consent, then limit-ad-tracking, else real.
// ZEROED_NO_CONSENT currently means only that the request's
// tracking_authorization_status is not "authorized". GDPR, TCF and GPP consent
// are not evaluated yet.
enum AdvertisingIdState {
  ADVERTISING_ID_STATE_UNSPECIFIED = 0;
  ADVERTISING_ID_STATE_REAL = 1;
  ADVERTISING_ID_STATE_ZEROED_COPPA = 2;
  ADVERTISING_ID_STATE_ZEROED_NO_CONSENT = 3;
  ADVERTISING_ID_STATE_ZEROED_LAT = 4;
}

// Envelope is the common header present on every event. Identity and join
// keys are flat; the rest is grouped by topic. A group the event has nothing
// for is left unset, and fields the stage has not produced stay at the proto3
// default. The header is defined by the telemetry PRD and TRD
// (docs/PRD_BidOn_Telemetry - v1.pdf, docs/TRD_BidOn_Telemetry.md on the
// BAC-53 initiative branch).
//
// schema_version is the current major. Additive changes stay on this number.
// A breaking change bumps it.
// auction_id is the id on the request. The API requires the client to send it.
// app_id scopes joins because that client id is not globally unique.
// trace_id joins the event to the per-auction trace.
message Envelope {
  string event_id = 1;
  string event_name = 2;
  int64 event_ts = 3;
  int32 schema_version = 4;
  int64 app_id = 5;
  string auction_id = 6;
  string session_id = 7;
  string ad_type = 8;
  string ad_format = 9;
  string country = 10;
  string trace_id = 11;
  double sampling_rate = 12;
  string placement = 13;

  App app = 14;
  Device device = 15;
  Session session = 16;
  Privacy privacy = 17;
  Integration integration = 18;
  // Demand is set only on events about one DSP.
  Demand demand = 19;

  message App {
    string app_key = 1;
    string bundle = 2;
    string app_version = 3;
    string sdk_version = 4;
    string publisher_id = 5;
    string wrapper_version = 6;
  }

  message Device {
    string os = 1;
    string os_version = 2;
    int32 os_api_level = 3;
    string model = 4;
    string manufacturer = 5;
    // oRTB device type. 4 = phone, 5 = tablet.
    int32 device_type = 6;
    ConnectionType connection_type = 7;
    int32 screen_width = 8;
    int32 screen_height = 9;
    double screen_density = 10;
  }

  message Session {
    int64 start_ts = 1;
    // The request's session clock is a monotonic tick, not milliseconds, so
    // the server leaves this unset.
    int64 sdk_uptime_ms = 2;
    string ab_test_group = 3;
  }

  message Privacy {
    string advertising_id = 1;
    AdvertisingIdState advertising_id_state = 2;
    bool lmt = 3;
    // dnt is a separate signal from limit-ad-tracking. The request does not carry it.
    bool dnt = 4;
    bool coppa = 5;
    bool gdpr_applies = 6;
    bool has_tcf_string = 7;
    string us_privacy = 8;
    string gpp_string = 9;
    bool gpp_consent = 10;
    bool mspa_enforced = 11;
    ConsentSource consent_source = 12;
  }

  message Integration {
    Host host = 1;
    AuctionOwner auction_owner = 2;
    IntegrationMode integration_mode = 3;
    Mediator mediator = 4;
    string mediator_sdk_version = 5;
  }

  message Demand {
    string dsp_id = 1;
    DemandType demand_type = 2;
    string bid_id = 3;
    string token_id = 4;
    string ad_unit_id = 5;
  }
}

// Scope is the auction phase an event describes.
enum Scope {
  SCOPE_UNSPECIFIED = 0;
  SCOPE_BIDDING_ROUND = 1;
}

// Outcome is the DSP-leg result after send/return.
enum Outcome {
  OUTCOME_UNSPECIFIED = 0;
  OUTCOME_BID = 1;
  OUTCOME_NOBID = 2;
  OUTCOME_TIMEOUT = 3;
  OUTCOME_HTTP_ERROR = 4;
  OUTCOME_MALFORMED = 5;
}

// RejectReason is why a received bid was discarded.
enum RejectReason {
  REJECT_REASON_UNSPECIFIED = 0;
  REJECT_REASON_BELOW_FLOOR = 1;
}

// ErrorCode is a short auction-level failure class.
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_NO_ADS_FOUND = 1;
  ERROR_CODE_INVALID_AUCTION_KEY = 2;
  ERROR_CODE_ERROR = 3;
}

// AuctionRequestReceived is emitted when /v2/auction is accepted.
// requested_price_floor is the SDK floor, a different field from the effective
// price_floor on AuctionCompleted and DspResponseRejected. It is not a rename.
message AuctionRequestReceived {
  option (event_name) = "auction_request_received";

  Envelope envelope = 1;
  // SDK floor only. Not the effective price_floor used to accept or reject bids.
  double requested_price_floor = 2;
}

// AuctionCompleted is emitted when the server bidding round finishes.
// price_floor here is the effective floor (SDK floor, cached prices, and the
// auction configuration floor). A bid counts only when price > price_floor.
// It is not requested_price_floor.
message AuctionCompleted {
  option (event_name) = "auction_completed";

  Envelope envelope = 1;
  Scope scope = 2;
  string winner_dsp = 3;
  double price = 4;
  // Distinct DSPs a request was sent to; equals the dsp_request_sent and
  // dsp_response_received count. Adapters that fail to build and cached bids
  // are excluded.
  int32 participant_count = 5;
  int64 total_latency_ms = 6;
  ErrorCode error_code = 7;
  // Effective floor for this auction. Not requested_price_floor.
  double price_floor = 8;
}

// DspRequestSent is emitted immediately before the adapter HTTP call.
message DspRequestSent {
  option (event_name) = "dsp_request_sent";
  option (requires_dsp) = true;

  Envelope envelope = 1;
  Scope scope = 2;
}

// DspResponseReceived is emitted after the adapter returns, once per
// dsp_request_sent. Multi-slot DSPs (Amazon) report their best slot.
message DspResponseReceived {
  option (event_name) = "dsp_response_received";
  option (requires_dsp) = true;

  Envelope envelope = 1;
  Scope scope = 2;
  Outcome outcome = 3;
  int32 http_status = 4;
  int64 latency_ms = 5;
  double price = 6;
}

// DspResponseRejected is emitted when a bid exists but price <= price_floor.
// price_floor is the effective floor, the same value as AuctionCompleted, not
// requested_price_floor.
message DspResponseRejected {
  option (event_name) = "dsp_response_rejected";
  option (requires_dsp) = true;

  Envelope envelope = 1;
  Scope scope = 2;
  double price = 3;
  // Effective floor this bid failed to beat. Not requested_price_floor.
  double price_floor = 4;
  RejectReason reject_reason = 5;
}

// Client catalog for POST /v2/telemetry. Append-only: Confluent message
// indexes follow file order, so do not insert messages above this line.
// Server auction and DSP messages are not accepted on this endpoint.
// error_code on client events is a banded string, not ErrorCode.

// SdkInitStarted is emitted when BidonSdk.initialize() is entered.
message SdkInitStarted {
  option (event_name) = "sdk_init_started";

  Envelope envelope = 1;
  string init_trigger = 2;
}

// SdkInitCompleted is emitted when init finishes.
message SdkInitCompleted {
  option (event_name) = "sdk_init_completed";

  Envelope envelope = 1;
  int64 duration_ms = 2;
  repeated string adapters_registered = 3;
  string config_source = 4;
}

// SdkInitFailed is emitted when init throws or times out.
message SdkInitFailed {
  option (event_name) = "sdk_init_failed";

  Envelope envelope = 1;
  string error_code = 2;
  string failed_phase = 3;
  int64 duration_ms = 4;
}

// AdapterInitResult is one adapter's init result.
message AdapterInitResult {
  option (event_name) = "adapter_init_result";

  Envelope envelope = 1;
  string adapter_name = 2;
  string adapter_version = 3;
  bool success = 4;
  int64 duration_ms = 5;
  string error_code = 6;
  string external_error_code = 7;
}

// ConfigFetchResult is the remote config call.
message ConfigFetchResult {
  option (event_name) = "config_fetch_result";

  Envelope envelope = 1;
  bool success = 2;
  int64 duration_ms = 3;
  int32 http_status = 4;
  bool from_cache = 5;
}

// AdapterTokenRequested is emitted when a bidding adapter is asked for a token.
message AdapterTokenRequested {
  option (event_name) = "adapter_token_requested";

  Envelope envelope = 1;
  string adapter_name = 2;
  int64 timeout_budget_ms = 3;
}

// AdapterTokenResult is emitted when a bidding adapter token settles.
message AdapterTokenResult {
  option (event_name) = "adapter_token_result";

  Envelope envelope = 1;
  string adapter_name = 2;
  int64 duration_ms = 3;
  string outcome = 4;
  int64 token_size_bytes = 5;
  string error_code = 6;
  string external_error_code = 7;
}

// TokenCollectionCompleted is emitted when every token adapter settles or the budget is hit.
message TokenCollectionCompleted {
  option (event_name) = "token_collection_completed";

  Envelope envelope = 1;
  int64 total_duration_ms = 2;
  int64 adapters_requested = 3;
  int64 adapters_returned = 4;
  int64 adapters_timed_out = 5;
}

// AdRequestStarted is emitted when the publisher calls load().
message AdRequestStarted {
  option (event_name) = "ad_request_started";

  Envelope envelope = 1;
  string placement = 2;
  double price_floor = 3;
  bool is_autorefresh = 4;
  bool cached_ad_available = 5;
  string trigger = 6;
  string auction_key = 7;
}

// AuctionRequested is emitted when the SDK is about to call /v2/auction.
message AuctionRequested {
  option (event_name) = "auction_requested";

  Envelope envelope = 1;
  double price_floor = 2;
  int64 token_count = 3;
  repeated string adapters_included = 4;
}

// AuctionResponseReceived is emitted when the SDK receives the /v2/auction response.
message AuctionResponseReceived {
  option (event_name) = "auction_response_received";

  Envelope envelope = 1;
  int64 duration_ms = 2;
  int64 demand_count = 3;
  double top_ecpm = 4;
  int64 response_size_bytes = 5;
}

// AdFilled is emitted when the auction fills. Distinct from ad_loaded.
message AdFilled {
  option (event_name) = "ad_filled";

  Envelope envelope = 1;
  string demand_id = 2;
  double price = 3;
  string bid_type = 4;
}

// AuctionFailed is emitted when there is no auction response, or the call errors.
message AuctionFailed {
  option (event_name) = "auction_failed";

  Envelope envelope = 1;
  int64 duration_ms = 2;
  string error_code = 3;
  int32 http_status = 4;
}

// AuctionNoDemand is a valid auction response with zero eligible demand.
message AuctionNoDemand {
  option (event_name) = "auction_no_demand";

  Envelope envelope = 1;
  double price_floor = 2;
  string reason = 3;
}

// AdLoadRequested is emitted when the SDK starts loading the returned ad.
message AdLoadRequested {
  option (event_name) = "ad_load_requested";

  Envelope envelope = 1;
  string caller = 2;
  bool has_bid_response = 3;
}

// AdmParseResult is emitted when the creative payload is parsed.
message AdmParseResult {
  option (event_name) = "adm_parse_result";

  Envelope envelope = 1;
  bool success = 2;
  string bid_id = 3;
  string dsp_id = 4;
  string crtype = 5;
  string envelope_version = 6;
  repeated string unknown_fields = 7;
  bool fallback_applied = 8;
  int64 duration_ms = 9;
}

// RendererSelected is emitted when a renderer is chosen.
message RendererSelected {
  option (event_name) = "renderer_selected";

  Envelope envelope = 1;
  string renderer = 2;
  string crtype = 3;
  string selection_reason = 4;
}

// AdLoaded is emitted when the creative finishes loading.
message AdLoaded {
  option (event_name) = "ad_loaded";

  Envelope envelope = 1;
  int64 total_duration_ms = 2;
  string renderer = 3;
  int64 creative_size_bytes = 4;
}

// AdLoadFailed is emitted when creative load fails.
message AdLoadFailed {
  option (event_name) = "ad_load_failed";

  Envelope envelope = 1;
  string demand_id = 2;
  string error_domain = 3;
  string error_code = 4;
  int64 duration_ms = 5;
  string failed_stage = 6;
}

// AdExpired is emitted when a loaded ad passes its TTL.
message AdExpired {
  option (event_name) = "ad_expired";

  Envelope envelope = 1;
  int64 ttl_ms = 2;
  int64 age_at_expiry_ms = 3;
}

// AdShowRequested is emitted when the SDK is asked to show a loaded ad.
message AdShowRequested {
  option (event_name) = "ad_show_requested";

  Envelope envelope = 1;
  int64 time_since_loaded_ms = 2;
}

// AdImpression is the client impression. Billing stays on /v2/show.
message AdImpression {
  option (event_name) = "ad_impression";

  Envelope envelope = 1;
  int64 render_duration_ms = 2;
  bool om_enabled = 3;
}

// AdShowFailed is emitted when show fails.
message AdShowFailed {
  option (event_name) = "ad_show_failed";

  Envelope envelope = 1;
  string error_code = 2;
  string failed_stage = 3;
}

// AdViewable is emitted when an impression becomes viewable.
message AdViewable {
  option (event_name) = "ad_viewable";

  Envelope envelope = 1;
  int64 time_to_viewable_ms = 2;
  bool om_enabled = 3;
  string om_partner_name = 4;
}

// AdClicked is a click on the shown ad.
message AdClicked {
  option (event_name) = "ad_clicked";

  Envelope envelope = 1;
  string click_target = 2;
  int64 time_since_impression_ms = 3;
}

// AdClosed is emitted when the shown ad closes.
message AdClosed {
  option (event_name) = "ad_closed";

  Envelope envelope = 1;
  int64 time_visible_ms = 2;
  string close_method = 3;
}

// AdRewardGranted is emitted when a rewarded ad grants the reward.
message AdRewardGranted {
  option (event_name) = "ad_reward_granted";

  Envelope envelope = 1;
}

// WebviewError is a WebView error while rendering.
message WebviewError {
  option (event_name) = "webview_error";

  Envelope envelope = 1;
  string error_code = 2;
  string description = 3;
  string failing_url_host = 4;
  bool is_main_frame = 5;
}

// RenderCrashed is emitted when the renderer crashes.
message RenderCrashed {
  option (event_name) = "render_crashed";

  Envelope envelope = 1;
  string renderer = 2;
  string crtype = 3;
}

// VideoStart is emitted when video starts.
message VideoStart {
  option (event_name) = "video_start";

  Envelope envelope = 1;
}

// VideoQ1 is the first quartile.
message VideoQ1 {
  option (event_name) = "video_q1";

  Envelope envelope = 1;
}

// VideoMidpoint is the midpoint.
message VideoMidpoint {
  option (event_name) = "video_midpoint";

  Envelope envelope = 1;
}

// VideoQ3 is the third quartile.
message VideoQ3 {
  option (event_name) = "video_q3";

  Envelope envelope = 1;
}

// VideoComplete is emitted when video completes.
message VideoComplete {
  option (event_name) = "video_complete";

  Envelope envelope = 1;
}

// VideoSkipped is emitted when video is skipped.
message VideoSkipped {
  option (event_name) = "video_skipped";

  Envelope envelope = 1;
}

// VideoError is a video playback error.
message VideoError {
  option (event_name) = "video_error";

  Envelope envelope = 1;
  string error_code = 2;
}

// AdapterLoadBudgetExceeded is emitted when the MAX adapter load budget elapses.
message AdapterLoadBudgetExceeded {
  option (event_name) = "adapter_load_budget_exceeded";

  Envelope envelope = 1;
  int64 elapsed_ms = 2;
  int64 budget_ms = 3;
  string stage_at_overrun = 4;
  int64 attempts_made = 5;
}

// NoFillReturnedToMax is emitted when Bidon returns no-fill so MAX can fall through.
message NoFillReturnedToMax {
  option (event_name) = "no_fill_returned_to_max";

  Envelope envelope = 1;
  string reason = 2;
  int64 attempts_made = 3;
  int64 total_duration_ms = 4;
}

// SignalRequested is emitted when MAX calls collectSignal().
message SignalRequested {
  option (event_name) = "signal_requested";

  Envelope envelope = 1;
}

// SignalProvided is emitted when a signal token is returned to MAX.
message SignalProvided {
  option (event_name) = "signal_provided";

  Envelope envelope = 1;
  int64 duration_ms = 2;
  string token_id = 3;
  int64 token_size_bytes = 4;
  bool gaid_available = 5;
  string token_source = 6;
}

// SignalFailed is emitted when collectSignal() fails.
message SignalFailed {
  option (event_name) = "signal_failed";

  Envelope envelope = 1;
  int64 duration_ms = 2;
  string error_code = 3;
}

// SignalTimeoutSuspected is emitted when our timer exceeds MAX's signal budget.
message SignalTimeoutSuspected {
  option (event_name) = "signal_timeout_suspected";

  Envelope envelope = 1;
  int64 duration_ms = 2;
  int64 budget_ms = 3;
}

// MetricObservation is one client metric sample. It is applied to /metrics
// and is not a telemetry-events row, so it does not embed Envelope.
message MetricObservation {
  string name = 1;
  string type = 2;
  double value = 3;
  map<string, string> labels = 4;
}
