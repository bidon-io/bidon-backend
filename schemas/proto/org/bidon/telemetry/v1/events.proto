syntax = "proto3";

package org.bidon.telemetry.v1;

import "google/protobuf/descriptor.proto";

extend google.protobuf.MessageOptions {
  // Catalog event_name for a telemetry-events message. Every message that
  // embeds Envelope must declare it; the emitter reads it from the type.
  string event_name = 50000;
}

// Envelope is the identity header embedded in every catalog event.
message Envelope {
  string event_id = 1;
  string event_name = 2;
  int64 event_ts = 3;
  string schema_version = 4;
  int64 app_id = 5;
  string auction_id = 6;
  string session_id = 7;
  string ad_type = 8;
  string ad_format = 9;
  string country = 10;
  string trace_id = 11;
  double sampling_rate = 12;
}

// Scope is the auction phase an event describes.
enum Scope {
  SCOPE_UNSPECIFIED = 0;
  SCOPE_BIDDING_ROUND = 1;
}

// Outcome is the DSP-leg result after send/return.
enum Outcome {
  OUTCOME_UNSPECIFIED = 0;
  OUTCOME_BID = 1;
  OUTCOME_NOBID = 2;
  OUTCOME_TIMEOUT = 3;
  OUTCOME_HTTP_ERROR = 4;
  OUTCOME_MALFORMED = 5;
}

// RejectReason is why a received bid was discarded.
enum RejectReason {
  REJECT_REASON_UNSPECIFIED = 0;
  REJECT_REASON_BELOW_FLOOR = 1;
}

// ErrorCode is a short auction-level failure class.
enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_NO_ADS_FOUND = 1;
  ERROR_CODE_INVALID_AUCTION_KEY = 2;
  ERROR_CODE_ERROR = 3;
}

// AuctionRequestReceived is emitted when /v2/auction is accepted.
// requested_price_floor is the SDK floor, a different field from the effective
// price_floor on AuctionCompleted and DspResponseRejected. It is not a rename.
message AuctionRequestReceived {
  option (event_name) = "auction_request_received";

  Envelope envelope = 1;
  // SDK floor only. Not the effective price_floor used to accept or reject bids.
  double requested_price_floor = 2;
}

// AuctionCompleted is emitted when the server bidding round finishes.
// price_floor here is the effective floor (SDK floor, cached prices, and the
// auction configuration floor). A bid counts only when price > price_floor.
// It is not requested_price_floor.
message AuctionCompleted {
  option (event_name) = "auction_completed";

  Envelope envelope = 1;
  Scope scope = 2;
  string winner_dsp = 3;
  double price = 4;
  // Distinct DSPs a request was sent to; equals the dsp_request_sent and
  // dsp_response_received count. Adapters that fail to build and cached bids
  // are excluded.
  int32 participant_count = 5;
  int64 total_latency_ms = 6;
  ErrorCode error_code = 7;
  // Effective floor for this auction. Not requested_price_floor.
  double price_floor = 8;
}

// DspRequestSent is emitted immediately before the adapter HTTP call.
message DspRequestSent {
  option (event_name) = "dsp_request_sent";

  Envelope envelope = 1;
  Scope scope = 2;
  string dsp = 3;
}

// DspResponseReceived is emitted after the adapter returns, once per
// dsp_request_sent. Multi-slot DSPs (Amazon) report their best slot.
message DspResponseReceived {
  option (event_name) = "dsp_response_received";

  Envelope envelope = 1;
  Scope scope = 2;
  string dsp = 3;
  Outcome outcome = 4;
  int32 http_status = 5;
  int64 latency_ms = 6;
  double price = 7;
}

// DspResponseRejected is emitted when a bid exists but price <= price_floor.
// price_floor is the effective floor, the same value as AuctionCompleted, not
// requested_price_floor.
message DspResponseRejected {
  option (event_name) = "dsp_response_rejected";

  Envelope envelope = 1;
  Scope scope = 2;
  string dsp = 3;
  double price = 4;
  // Effective floor this bid failed to beat. Not requested_price_floor.
  double price_floor = 5;
  RejectReason reject_reason = 6;
}

// AdImpression is a show. /v2/show synthesizes a row (dsp and price;
// render_duration_ms and om_enabled unset) when the call did not carry an SDK
// event. A client event_id is published as-is, and the server does not emit
// a second row for the same call.
message AdImpression {
  option (event_name) = "ad_impression";

  Envelope envelope = 1;
  int64 render_duration_ms = 2;
  bool om_enabled = 3;
  string dsp = 4;
  double price = 5;
}

// NoticeType is which OpenRTB notice was attempted.
// TimeoutURL is recorded as loss_notice_sent; the metric label stays
// "timeout" so the two can be told apart.
enum NoticeType {
  NOTICE_TYPE_UNSPECIFIED = 0;
  NOTICE_TYPE_WIN = 1;
  NOTICE_TYPE_BILLING = 2;
  NOTICE_TYPE_LOSS = 3;
  NOTICE_TYPE_TIMEOUT = 4;
}

// WinNoticeSent is an nurl attempt, including success=false after retries.
message WinNoticeSent {
  option (event_name) = "win_notice_sent";

  Envelope envelope = 1;
  string dsp = 2;
  double clearing_price = 3;
  bool success = 4;
  int32 http_status = 5;
  int32 retry_count = 6;
  int64 latency_ms = 7;
}

// BillingNoticeSent is a burl attempt, including success=false after retries.
message BillingNoticeSent {
  option (event_name) = "billing_notice_sent";

  Envelope envelope = 1;
  string dsp = 2;
  double billable_price = 3;
  bool success = 4;
  int32 http_status = 5;
  int32 retry_count = 6;
  int64 latency_ms = 7;
}

// LossNoticeSent is an lurl attempt. TimeoutURL uses this message too.
message LossNoticeSent {
  option (event_name) = "loss_notice_sent";

  Envelope envelope = 1;
  string dsp = 2;
  int32 loss_reason_code = 3;
  double winning_price = 4;
  bool success = 5;
  int32 http_status = 6;
  int32 retry_count = 7;
  int64 latency_ms = 8;
}

// NoticeDeliveryFailed is emitted with the *_sent event when delivery did not
// succeed. *_sent.success is false on that same attempt.
message NoticeDeliveryFailed {
  option (event_name) = "notice_delivery_failed";

  Envelope envelope = 1;
  string dsp = 2;
  NoticeType notice_type = 3;
  int32 http_status = 4;
  int32 attempts = 5;
  int64 latency_ms = 6;
  // Short class: http_4xx, http_5xx, transport. Not the response body.
  string error_code = 7;
}
