x-golang-dev-app-base: &golang-dev-app-base
  volumes:
    - .:/app
    - gomodcache-dev:/go/pkg/mod
    - gocache-dev:/root/.cache/go-build
  working_dir: /app

x-dev-db-env: &dev-db-env
  DATABASE_URL: postgres://bidon:pass@postgres:5432/bidon
  DATABASE_REPLICA_URL: postgres://bidon:pass@postgres:5432/bidon

x-dev-kafka-env: &dev-kafka-env
  USE_KAFKA: "true"
  KAFKA_BROKERS_LIST: redpanda:9092
  KAFKA_CLIENT_ID: bidon_dev
  KAFKA_DELIVERY_INTERVAL: 5
  KAFKA_AD_EVENTS_TOPIC: ad-events
  KAFKA_NOTIFICATION_EVENTS_TOPIC: notification-events

x-dev-redis-env: &dev-redis-env
  REDIS_URL: redis://redis:6379/0

x-dev-bidon-app-env: &dev-bidon-app-env
  <<: *dev-kafka-env
  ENVIRONMENT: development
  USE_GEOCODING: "true"
  MAXMIND_GEOIP_FILE_PATH: GeoLite2-City.mmdb
  SNOWFLAKE_NODE_ID: 1

x-dev-superuser-env: &dev-superuser-env
  SUPERUSER_LOGIN: login
  SUPERUSER_PASSWORD: password

services:
  postgres:
    image: postgres:17-alpine
    ports:
      - '5434:5432'
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: bidon
      POSTGRES_USER: bidon
      POSTGRES_PASSWORD: pass
    healthcheck:
      test: pg_isready -U bidon -d bidon
      interval: 5s

  redis:
    image: redis:7.4-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v26.1.9
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=warn
    ports:
      - '19092:19092'
      - '9644:9644'
    volumes:
      - redpanda-data-dev:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.8.15
    ports:
      - '8080:8080'
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:9092
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/admin/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  migrate:
    image: golang:1.24-alpine
    <<: *golang-dev-app-base
    command: go run ./cmd/bidon-migrate -no-gen up
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: [*dev-db-env, *dev-bidon-app-env]

  bidon-seed:
    image: golang:1.24-alpine
    <<: *golang-dev-app-base
    command: go run ./cmd/bidon-seed --sample --reset
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: [*dev-db-env, *dev-bidon-app-env]

  bidon-admin:
    image: golang:1.24-alpine
    <<: *golang-dev-app-base
    command: go run ./cmd/bidon-admin
    ports:
      - '1323:1323'
      - '50051:50051'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redpanda:
        condition: service_healthy
    environment:
      <<: [*dev-db-env, *dev-bidon-app-env, *dev-superuser-env]
      PORT: 1323
      GRPC_PORT: 50051
      APP_SECRET: app_secret

  bidon-sdkapi:
    image: golang:1.24-alpine
    <<: *golang-dev-app-base
    command: go run ./cmd/bidon-sdkapi
    ports:
      - '1324:1323'
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    environment:
      <<: [*dev-db-env, *dev-bidon-app-env, *dev-redis-env]
      PORT: 1323
      APP_SECRET: app_secret

  bidon-ui:
    image: node:22-alpine
    working_dir: /workspace/web/bidon_ui
    command: yarn dev-container
    ports:
      - '3010:3010'
    depends_on:
      bidon-admin:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3010/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    environment:
      NUXT_API_PROXY_TARGET: http://bidon-admin:1323
      # Force polling-based file watching so host file edits are reliably detected in Docker.
      CHOKIDAR_USEPOLLING: "true"
      # Enable polling in webpack/watchpack dependencies used by Nuxt/Vite plugin tooling.
      WATCHPACK_POLLING: "true"
    volumes:
      - .:/workspace
      - bidon-ui-node-modules-dev:/workspace/web/bidon_ui/node_modules

  init-admin:
    image: alpine/curl
    depends_on:
      bidon-admin:
        condition: service_started
    environment:
      <<: *dev-superuser-env
      BIDON_ADMIN_URL: http://bidon-admin:1323
    volumes:
      - ./scripts/init-admin.sh:/init-admin.sh
    command: sh /init-admin.sh


volumes:
  pgdata-dev:
  gomodcache-dev:
  gocache-dev:
  redpanda-data-dev:
  bidon-ui-node-modules-dev:
