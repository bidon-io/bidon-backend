x-restart-policy: &restart-policy
  restart: unless-stopped

x-logging: &default-logging
  options:
    max-size: "100m"
    max-file: "5"
  driver: json-file

# Required env vars (set in .env or Coolify environment):
#   DATABASE_URL              — optional toggle; unset = in-compose postgres service.
#     Local (default / Coolify previews): omit or use
#       postgres://bidon:${PG_PASSWORD:-password}@postgres:5432/bidon?sslmode=disable
#     Hosted staging: set to managed URI (terraform output -raw db_app_private_uri).
#     The postgres container always runs; DATABASE_URL only chooses where apps connect.
#   PG_PASSWORD               — password for the in-compose postgres (default: password)
#   APP_SECRET                — random secret for session signing
#   SUPERUSER_LOGIN           — initial admin username
#   SUPERUSER_PASSWORD        — initial admin password
#   BIDON_ADMIN_TAG           — Docker image tag for bidon-admin (e.g. git SHA from CI)
#   BIDON_SDKAPI_TAG          — Docker image tag for bidon-sdkapi
#   BIDON_MIGRATE_TAG         — Docker image tag for bidon-migrate
#   BIDON_SEED_TAG            — Docker image tag for bidon-seed
#   BIDON_UI_TAG              — Docker image tag for bidon-ui (e.g. git SHA from CI)
#   MAXMIND_GEOIP_ACCOUNT_ID  — MaxMind account ID for GeoLite2-City updates
#   MAXMIND_GEOIP_LICENSE_KEY — MaxMind license key for GeoLite2-City updates
#   REDPANDA_CONSOLE_BA_USERS — Traefik basicAuth.users for redpanda-console only (never commit).
#     Generate: htpasswd -nbBC 10 <user> '<password>'  →  one line: user:$2y$10$...
#     Coolify: reference this var under redpanda-console.environment (below) so it is in the
#     deployment .env and ${REDPANDA_CONSOLE_BA_USERS} in labels is interpolated — labels-only refs can stay literal.
#     For bcrypt, mark the value “literal” in Coolify if $ characters get stripped.
#     Gitignored .env beside compose: if Compose treats $ inside values as substitution, escape with $$ per $ in the hash segment.

x-staging-db-env: &staging-db-env
  DATABASE_URL: ${DATABASE_URL:-postgres://bidon:${PG_PASSWORD:-password}@postgres:5432/bidon?sslmode=disable}
  DATABASE_REPLICA_URL: ${DATABASE_URL:-postgres://bidon:${PG_PASSWORD:-password}@postgres:5432/bidon?sslmode=disable}

x-staging-kafka-env: &staging-kafka-env
  USE_KAFKA: "true"
  KAFKA_BROKERS_LIST: redpanda:29092
  KAFKA_CLIENT_ID: bidon_staging
  KAFKA_DELIVERY_INTERVAL: 5
  KAFKA_AD_EVENTS_TOPIC: ad-events
  KAFKA_NOTIFICATION_EVENTS_TOPIC: notification-events

x-staging-redis-env: &staging-redis-env
  REDIS_URL: redis://redis:6379/0
  REDIS_CLUSTER: redis://redis:6379/0

x-staging-bidon-app-env: &staging-bidon-app-env
  <<: [*staging-kafka-env, *staging-redis-env]
  ENVIRONMENT: production
  USE_GEOCODING: "true"
  MAXMIND_GEOIP_FILE_PATH: /public/system/GeoLite2-City.mmdb
  SNOWFLAKE_NODE_ID: 1

services:
  # Always runs. Apps use it when DATABASE_URL is unset; override DATABASE_URL for managed Postgres.
  postgres:
    image: postgres:17-alpine
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: bidon
      POSTGRES_USER: bidon
      POSTGRES_PASSWORD: ${PG_PASSWORD:-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bidon -d bidon"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging: *default-logging
    <<: *restart-policy

  geodb-maxmind:
    image: maxmindinc/geoipupdate:v4.7.1
    environment:
      GEOIPUPDATE_ACCOUNT_ID: ${MAXMIND_GEOIP_ACCOUNT_ID}
      GEOIPUPDATE_LICENSE_KEY: ${MAXMIND_GEOIP_LICENSE_KEY}
      GEOIPUPDATE_EDITION_IDS: GeoLite2-City
      GEOIPUPDATE_FREQUENCY: 72
    volumes:
      - geodb:/usr/share/GeoIP
    healthcheck:
      test: ["CMD-SHELL", "test -f /usr/share/GeoIP/GeoLite2-City.mmdb"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging: *default-logging
    <<: *restart-policy

  redpanda:
    image: redpandadata/redpanda:v26.1.9
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 1G
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging: *default-logging
    <<: *restart-policy

  # Redpanda Console (UI): expose publicly via Coolify → Traefik; protect with Basic Auth middleware
  # labels only on this service. Kafka brokers stay at redpanda:29092 without proxy auth — see Coolify docs:
  # https://coolify.io/docs/knowledge-base/proxy/traefik/basic-auth#docker-compose-and-services
  redpanda-console:
    image: redpandadata/console:v2.8.15
    expose:
      - "8080"
    depends_on:
      redpanda:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: redpanda:29092
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/admin/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    labels:
      - "traefik.http.middlewares.redpanda-console-ba.basicauth.users=${REDPANDA_CONSOLE_BA_USERS}"
      - "coolify.traefik.middlewares=redpanda-console-ba"
    logging: *default-logging
    <<: *restart-policy

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
    logging: *default-logging
    <<: *restart-policy

  migrate:
    image: "registry.digitalocean.com/bidon-io/bidon-migrate:${BIDON_MIGRATE_TAG}"
    command: up
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: [*staging-db-env, *staging-bidon-app-env]
    logging: *default-logging

  bidon-admin:
    image: "registry.digitalocean.com/bidon-io/bidon-admin:${BIDON_ADMIN_TAG}"
    expose:
      - "1323"
      - "50051"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    environment:
      <<: [*staging-db-env, *staging-bidon-app-env]
      PORT: 1323
      GRPC_PORT: 50051
      APP_SECRET: ${APP_SECRET}
      SUPERUSER_LOGIN: ${SUPERUSER_LOGIN}
      SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD}
    logging: *default-logging
    <<: *restart-policy

  bidon-sdkapi:
    image: "registry.digitalocean.com/bidon-io/bidon-sdkapi:${BIDON_SDKAPI_TAG}"
    expose:
      - "1323"
    depends_on:
      geodb-maxmind:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    environment:
      <<: [*staging-db-env, *staging-bidon-app-env]
      PORT: 1323
      APP_SECRET: ${APP_SECRET}
    volumes:
      - geodb:/public/system
    logging: *default-logging
    <<: *restart-policy

  bidon-seed:
    image: "registry.digitalocean.com/bidon-io/bidon-seed:${BIDON_SEED_TAG}"
    command: ["/bidon-seed", "--sample", "--reset"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      <<: [*staging-db-env, *staging-bidon-app-env]
    restart: "no"
    logging: *default-logging

  init-admin:
    image: curlimages/curl:latest
    depends_on:
      bidon-admin:
        condition: service_started
    environment:
      SUPERUSER_LOGIN: ${SUPERUSER_LOGIN}
      SUPERUSER_PASSWORD: ${SUPERUSER_PASSWORD}
      BIDON_ADMIN_URL: http://bidon-admin:1323
    volumes:
      - ./scripts:/scripts:ro
    command: sh /scripts/init-admin.sh
    restart: "no"
    logging: *default-logging

  bidon-ui:
    image: "registry.digitalocean.com/bidon-io/bidon-ui:${BIDON_UI_TAG}"
    expose:
      - "3000"
    depends_on:
      - bidon-admin
    environment:
      NUXT_API_PROXY_TARGET: http://${SERVICE_NAME_BIDON_ADMIN:-bidon-admin}:1323
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *default-logging
    <<: *restart-policy

volumes:
  geodb:
  postgres-data:
  redpanda-data:
  redis-data:
