name: Go / Run E2E Tests

on:
  workflow_dispatch:

concurrency:
  group: go-e2e-tests

env:
  COMPOSE_PROJECT_NAME: go_e2e_${{ github.run_number }}

jobs:
  test:
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - run: docker compose -f docker-compose.test.yml run --rm go-e2e

      - run: docker compose -f docker-compose.test.yml down --rmi local -v
        if: always()
