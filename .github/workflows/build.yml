name: Build

on:
  release:
    types: [published]

jobs:
  build:
    name: Build image
    runs-on: [self-hosted]
    matrix:
      fail-fast: false
      component: [api, back]
    steps:
      - name: Get latest release
        id: latest-release
        uses: octokit/request-action@v2.1.7
        with:
          route: GET /repos/${{ github.repository }}/releases/latest
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_RUNNER }}

      - name: Login registry
        uses: docker/login-action@v2
        with:
          registry: ${{ secrets.REGISTRY_ADDRESS }}
          username: ${{ secrets.REGISTRY_USERNAME_DEPLOY }}
          password: ${{ secrets.REGISTRY_PASSWORD_DEPLOY }}

      - name: Checks-out repository
        uses: actions/checkout@v3

      - name: Build image
        run: make docker-build-prod-${{ matrix.component }} TAG=${{ fromJson(steps.latest-release.outputs.data).tag_name }}

      - name: Push image
        run: make docker-push-prod-${{ matrix.component }} TAG=${{ fromJson(steps.latest-release.outputs.data).tag_name }}

  deploy:
    name: Deploy
    runs-on: [self-hosted]
    matrix:
      fail-fast: false
      component: [api, back]
    steps:
      - name: Get latest release
        id: latest-release
        uses: octokit/request-action@v2.1.7
        with:
          route: GET /repos/${{ github.repository }}/releases/latest
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_RUNNER }}

      - name: Checks-out repository devops
        uses: actions/checkout@v3
        with:
          repository: ${{ secrets.ANSIBLE_SECRET }}/devops
          token: ${{ secrets.PAT_RUNNER }}

      - name: Deploy
        working-directory: ./${{ secrets.ANSIBLE_SECRET }}/prod
        run: make bidon-${{ matrix.component }} TAG=${{ fromJson(steps.latest-release.outputs.data).tag_name }}
